# Fly app config for this fork. Region is EU (Frankfurt) because investor data is subject to GDPR.

app = 'tin-captable'
primary_region = 'fra'

[experimental]
allowed_public_ports = []
auto_rollback = true
# cmd = "./scripts/migrate.sh"
# entrypoint = "sh"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[deploy]
strategy = "canary"

[env]
NODE_ENV = "production"
