name: "Tests"

# Runs the tenant-isolation suite (tests/tenant/*), the unit tests, the type
# check, and lint on the files a pull request changes. Tests run against a
# throwaway Postgres service; the harness refuses any non-local database.

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test, typecheck, lint
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: captable
          POSTGRES_PASSWORD: password
          POSTGRES_DB: captable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U captable -d captable_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # tests/setup.ts refuses anything that is not localhost
      TEST_DATABASE_URL: postgres://captable:password@localhost:5432/captable_test
      DATABASE_URL: postgres://captable:password@localhost:5432/captable_test
      SKIP_ENV_VALIDATION: "1"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.2

      - name: 🟢 Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🗄️ Apply migrations to the test database
        run: pnpm prisma migrate deploy

      # next-env.d.ts is generated by Next and git-ignored; without it the
      # `*.svg` and image module declarations are missing and tsc fails
      - name: 🧩 Generate Next type references
        run: |
          printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts

      - name: 🔎 Type check
        run: pnpm tsc --noEmit -p .

      # run even if the type check failed, so one failure does not hide another
      - name: 🧪 Tests
        if: ${{ !cancelled() }}
        run: pnpm test

      # The repo has legacy lint errors, so lint only what this PR changes (the
      # pre-commit hook does the same for staged files).
      - name: 🧹 Lint changed files
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.ts' '*.tsx' '*.js' '*.cjs' '*.mjs' '*.json' | tr '\n' ' ')
          if [ -z "$files" ]; then echo "No lintable files changed"; exit 0; fi
          echo "$files" | tr ' ' '\n'
          pnpm exec biome check --no-errors-on-unmatched $files
